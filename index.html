    align-items: flex-start;

    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.02em;
    flex: none;

      inset 0 -1px 0 rgba(0, 0, 0, 0.45),

  .titles { flex: 1; min-width: 0; }

  .app-title {
    font-family: var(--font-cjk);
    font-weight: 900;
    font-size: 16px;

  .app-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--ink-faint);

    margin-top: 3px;

  .today-btn {
    flex: none;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;

    color: var(--steel);
    background: var(--plate);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--bevel);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .today-btn:hover { color: #fff; border-color: #2B3039; }
  .today-btn:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

  .sync-note {
    flex: none;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 0 22px 10px;
  }

  .rail {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 22px 18px;
    flex: none;
    scrollbar-width: none;
  }

  .rail::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    width: 44px;
    padding: 9px 0 8px;
    border-radius: 3px;
    border: 1px solid var(--line-soft);
    background: var(--surface);
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-family: var(--font-mono);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .chip:hover { border-color: #262A31; }
  .chip:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

  .chip .wd {
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    font-family: var(--font-cjk);
  }

  .chip .num {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .chip .dot {
    width: 14px;
    height: 2px;
    border-radius: 0;
    background: transparent;
  }

  .chip.has-open .dot { background: var(--steel); }
  .chip.has-all-done .dot { background: var(--brass); }

  .chip.selected {
    background: var(--brush);
    border-color: #D3DAE2;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 18px -6px rgba(201, 209, 218, 0.5);
  }

  .chip.selected .num { color: #08090A; font-weight: 700; }
  .chip.selected .wd { color: rgba(8, 9, 10, 0.62); }
  .chip.selected .dot { background: rgba(8, 9, 10, 0.35); }

    height: 12px;

  .task-check svg path { stroke: #08090A; }

    background: var(--brass);
    border-color: #C79E63;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);

  .task.done .task-check svg { opacity: 1; transform: scale(1); }

    color: var(--ink-faint);
    border-top: 1px solid var(--line-soft);
    margin-top: 22px;
  }

(function () {
  "use strict";

  var TASKS_BY_DATE = JSON.parse(document.getElementById("tasks-data").textContent);
  var STORE_KEY = "day-manifest-done-state";
  var DONE_STATE = {};
  try {
    DONE_STATE = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  } catch (e) {
    DONE_STATE = {};
  }

  var START = "2026-09-04";
  var END = "2026-10-04";
  var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
  var checkSvg =
    '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---- goofy sound effects (Web Audio, no files needed) ----
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        return null;
      }
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    return audioCtx;
  }
  function blip(freqFrom, freqTo, dur, type, startAt, vol) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "square";
    var t = ctx.currentTime + (startAt || 0);
    osc.frequency.setValueAtTime(freqFrom, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqTo, 1), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(vol || 0.16, t + Math.min(0.02, dur * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  function honk() {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var lfo = ctx.createOscillator();
    var lfoGain = ctx.createGain();
    var gain = ctx.createGain();
    osc.type = "sawtooth";
    var t = ctx.currentTime;
    osc.frequency.setValueAtTime(220, t);
    lfo.frequency.setValueAtTime(28, t);
    lfoGain.gain.setValueAtTime(18, t);
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
    gain.gain.setValueAtTime(0.16, t + 0.14);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain).connect(ctx.destination);
    lfo.start(t);
    osc.start(t);
    osc.stop(t + 0.24);
    lfo.stop(t + 0.24);
  }
  function playBoop(checked) {
    if (checked) {
      // silly clown-horn honk
      honk();
    } else {
      blip(500, 160, 0.12, "sawtooth", 0, 0.12);
    }
  }
  function playFanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    for (var i = 0; i < notes.length; i++) {
      blip(notes[i] * 0.9, notes[i], 0.16, "square", i * 0.08, 0.15);
    }
    blip(1200, 2200, 0.35, "triangle", notes.length * 0.08, 0.08);
  }

  function toDate(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function toKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function dateRange(startKey, endKey) {
    var out = [];
    var cur = toDate(startKey);
    var end = toDate(endKey);
    while (cur <= end) {
      out.push(toKey(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }

  var todayKey = toKey(new Date());
  var dates = dateRange(START, END);
  var selectedKey = dates.indexOf(todayKey) !== -1 ? todayKey : dates[0];

  (function () {
    var s = toDate(START), e = toDate(END);
    document.getElementById("rangeLine").textContent =
      (s.getMonth() + 1) + "." + String(s.getDate()).padStart(2, "0") + " — " +
      (e.getMonth() + 1) + "." + String(e.getDate()).padStart(2, "0");
  })();

  document.getElementById("sync-note").textContent = "已安裝喺呢部裝置 · 記錄留喺呢部機";

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(DONE_STATE));
    } catch (e) {
      // storage unavailable (private mode, quota) — state stays in memory only
    }
  }

  function isDayComplete(dateKey, state) {
    var tasks = TASKS_BY_DATE[dateKey] || [];
    if (!tasks.length) return false;
    for (var i = 0; i < tasks.length; i++) {
      if (!state[tasks[i].id]) return false;
    }
    return true;
  }

  function toggleTask(taskId, dateKey) {
    var wasComplete = isDayComplete(dateKey, DONE_STATE);
    DONE_STATE[taskId] = !DONE_STATE[taskId];
    playBoop(!!DONE_STATE[taskId]);
    renderPanel();
    renderRail();
    if (!wasComplete && isDayComplete(dateKey, DONE_STATE)) celebrate();
    persist();
  }

  function dayStatus(key) {
    var tasks = TASKS_BY_DATE[key] || [];
    if (!tasks.length) return "empty";
    var done = 0;
    for (var i = 0; i < tasks.length; i++) if (DONE_STATE[tasks[i].id]) done++;
    if (done === tasks.length) return "all-done";
    return "open";
  }

  var railEl = document.getElementById("rail");
  var panelEl = document.getElementById("panel");

  function renderRail() {
    railEl.innerHTML = "";
    dates.forEach(function (key) {
      var d = toDate(key);
      var status = dayStatus(key);
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className =
        "chip" +
        (key === selectedKey ? " selected" : "") +
        (status === "open" ? " has-open" : "") +
        (status === "all-done" ? " has-all-done" : "");
      chip.id = "chip-" + key;
      chip.setAttribute("aria-label", (d.getMonth() + 1) + "月" + d.getDate() + "日");
      chip.innerHTML =
        '<span class="wd">' + WEEKDAYS[d.getDay()] + "</span>" +
        '<span class="num">' + d.getDate() + "</span>" +
        '<span class="dot"></span>';
      chip.addEventListener("click", function () {
        selectDay(key, true);
      });
      railEl.appendChild(chip);
    });
  }

  function renderPanel() {
    var key = selectedKey;
    var d = toDate(key);
    var isToday = key === todayKey;
    var tasks = TASKS_BY_DATE[key] || [];
    var doneCount = 0;
    for (var i = 0; i < tasks.length; i++) if (DONE_STATE[tasks[i].id]) doneCount++;

    var isComplete = tasks.length > 0 && doneCount === tasks.length;

    var ringHtml = "";
    if (tasks.length) {
      var r = 19, c = 2 * Math.PI * r;
      var frac = doneCount / tasks.length;
      var offset = c * (1 - frac);
      var label = isComplete
        ? '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : doneCount + "/" + tasks.length;
      ringHtml =
        '<div class="ring-wrap' + (isComplete ? " complete" : "") + '"><svg viewBox="0 0 46 46">' +
        '<circle class="ring-track" cx="23" cy="23" r="' + r + '" fill="none" stroke-width="3"/>' +
        '<circle class="ring-fill" cx="23" cy="23" r="' + r + '" fill="none" stroke-width="3" ' +
        'stroke-linecap="butt" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/>' +
        '</svg><span class="ring-label">' + label + "</span></div>";
    }

    var bannerHtml = "";
    if (isComplete) {
      bannerHtml =
        '<div class="celebrate-banner">' +
        '<span class="icon"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<div><div class="text">今日行程全部完成</div>' +
        '<div class="sub">' + tasks.length + " / " + tasks.length + " CLEARED</div></div>" +
        "</div>";
    }

    var bodyHtml;
    if (!tasks.length) {
      bodyHtml = '<div class="empty-state">呢日冇安排行程<br>安心休息</div>';
    } else {
      bodyHtml =
        '<ol class="tasks">' +
        tasks
          .map(function (task) {
            var isDone = !!DONE_STATE[task.id];
            return (
              '<li class="task' + (isDone ? " done" : "") + '" data-id="' + task.id + '">' +
              '<button class="task-check" type="button" aria-label="標記完成:' + task.title + '">' + checkSvg + "</button>" +
              '<div class="task-body"><div class="task-title">' + task.title + "</div>" +
              '<div class="task-meta">' + task.time + '<span class="sep">·</span><span class="cat">' + task.tag + "</span></div>" +
              "</div></li>"
            );
          })
          .join("") +
        "</ol>";
    }

    panelEl.innerHTML =
      '<div class="day-head">' +
      '<span class="day-date">' + (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0") + "</span>" +
      '<div class="day-meta"><span class="day-wd">星期' + WEEKDAYS[d.getDay()] + "</span>" +
      (isToday ? '<div class="day-badge">Today</div>' : "") +
      "</div>" + ringHtml +
      "</div>" + bannerHtml + bodyHtml +
      '<div class="foot">' + dates.length + " days · " + Object.keys(TASKS_BY_DATE).reduce(function (n, k) { return n + TASKS_BY_DATE[k].length; }, 0) + " events</div>";

    panelEl.querySelectorAll(".task-check").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest(".task");
        toggleTask(li.dataset.id, key);
      });
    });
  }

  function celebrate() {
    playFanfare();
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;

    var canvas = document.getElementById("confettiCanvas");
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    var colors = ["#B08D57", "#C9D1DA", "#8A9099", "#E6EBF0"];
    var originX = w / 2;
    var originY = h * 0.32;
    var particles = Array.from({ length: 46 }, function () {
      var angle = Math.random() * Math.PI * 2;
      var speed = 2.5 + Math.random() * 4.5;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 2 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1
      };
    });

    var start = performance.now();
    var duration = 1400;

    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, w, h);
      particles.forEach(function (p) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.rot += p.vr;
        p.life = Math.max(0, 1 - t / duration);
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
        ctx.restore();
      });
      if (t < duration) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
      }
    }
    requestAnimationFrame(frame);
  }

  function selectDay(key, scrollChip) {
    selectedKey = key;
    renderRail();
    renderPanel();
    if (scrollChip) {
      var chip = document.getElementById("chip-" + key);
      if (chip) chip.scrollIntoView({ inline: "center", block: "nearest" });
    }
  }

  document.getElementById("todayBtn").addEventListener("click", function () {
    if (dates.indexOf(todayKey) !== -1) selectDay(todayKey, true);
  });

  renderRail();
  renderPanel();
  var initialChip = document.getElementById("chip-" + selectedKey);
  if (initialChip) initialChip.scrollIntoView({ inline: "center", block: "nearest" });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script></body></html>
