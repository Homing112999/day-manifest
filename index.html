  :root {
    --bg: #000000;
    --surface: #0B0C0E;
    --surface-raised: #101216;
    --bevel: rgba(255, 255, 255, 0.055);
    --line: #1B1E23;
    --line-soft: #131519;

    --ink: #F2F4F7;
    --ink-soft: #868C95;
    --ink-faint: #4C525B;

    --steel: #C9D1DA;
    --steel-dim: rgba(201, 209, 218, 0.10);
    --brass: #B08D57;
    --brass-dim: rgba(176, 141, 87, 0.13);

    --brush: linear-gradient(148deg, #EDF1F5 0%, #A8B1BB 38%, #4F555D 52%, #B9C2CC 78%, #7A828B 100%);
    --plate: linear-gradient(180deg, #15181C 0%, #0A0B0D 100%);

    --font-cjk: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
    --font-ui: "Archivo", "Noto Sans TC", "PingFang HK", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-cjk);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  @media (min-width: 640px) {
    body {
      padding: 56px 20px;
      align-items: center;
      background: radial-gradient(120% 80% at 50% 0%, #0A0B0D 0%, #000000 62%);
    }
    .app {
      min-height: min(780px, calc(100vh - 112px));
      max-height: 860px;
      border-radius: 6px;
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 var(--bevel),
        0 0 0 1px #000,
        0 48px 100px -36px #000;
      overflow: hidden;
    }
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: max(24px, env(safe-area-inset-top)) 22px 16px;
    flex: none;
  }

  .mark {
    width: 34px;
    height: 34px;
    border-radius: 4px;
    background: var(--brush);
    color: #0A0B0D;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.02em;
    flex: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.55),
      inset 0 -1px 0 rgba(0, 0, 0, 0.45),
      0 1px 3px rgba(0, 0, 0, 0.8);
  }

  .titles { flex: 1; min-width: 0; }

  .app-title {
    font-family: var(--font-cjk);
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }

  .app-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .today-btn {
    flex: none;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
    background: var(--plate);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--bevel);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .today-btn:hover { color: #fff; border-color: #2B3039; }
  .today-btn:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

  .sync-note {
    flex: none;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 0 22px 10px;
  }

  .rail {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 22px 18px;
    flex: none;
    scrollbar-width: none;
  }

  .rail::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    width: 44px;
    padding: 9px 0 8px;
    border-radius: 3px;
    border: 1px solid var(--line-soft);
    background: var(--surface);
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-family: var(--font-mono);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .chip:hover { border-color: #262A31; }
  .chip:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

  .chip .wd {
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    font-family: var(--font-cjk);
  }

  .chip .num {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .chip .dot {
    width: 14px;
    height: 2px;
    border-radius: 0;
    background: transparent;
  }

  .chip.has-open .dot { background: var(--steel); }
  .chip.has-all-done .dot { background: var(--brass); }

  .chip.selected {
    background: var(--brush);
    border-color: #D3DAE2;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 18px -6px rgba(201, 209, 218, 0.5);
  }

  .chip.selected .num { color: #08090A; font-weight: 700; }
  .chip.selected .wd { color: rgba(8, 9, 10, 0.62); }
  .chip.selected .dot { background: rgba(8, 9, 10, 0.35); }
  .chip.selected.has-all-done .dot { background: #6B5327; }

  .panel {
    flex: 1;
    overflow-y: auto;
    padding: 0 22px calc(30px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    box-shadow: inset 0 1px 0 var(--bevel);
  }

  .day-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 0 10px;
  }

  .day-date {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    background: var(--brush);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .day-meta { flex: 1; min-width: 0; }

  .day-wd {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .day-badge {
    display: inline-block;
    margin-top: 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #08090A;
    background: var(--steel);
    padding: 3px 8px;
    border-radius: 2px;
  }

  .ring-wrap {
    flex: none;
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    transition: box-shadow 0.4s ease;
  }
  .ring-wrap.complete { box-shadow: 0 0 22px -4px rgba(176, 141, 87, 0.55); }
  .ring-wrap svg { width: 46px; height: 46px; transform: rotate(-90deg); }
  .ring-track { stroke: #1B1E23; }
  .ring-fill { stroke: var(--brass); transition: stroke-dashoffset 0.4s ease; }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .ring-label svg { width: 15px; height: 15px; }
  .ring-label svg path { stroke: var(--brass); }

  .celebrate-banner {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 16px 0 2px;
    padding: 13px 14px;
    border-radius: 3px;
    background: var(--plate);
    border: 1px solid #2A2318;
    border-left: 2px solid var(--brass);
    box-shadow: inset 0 1px 0 var(--bevel);
    animation: banner-in 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.05) both;
  }

  .celebrate-banner .icon {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 2px;
    background: var(--brass);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }

  .celebrate-banner .icon svg { width: 12px; height: 12px; }
  .celebrate-banner .icon svg path { stroke: #0A0B0D; }

  .celebrate-banner .text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .celebrate-banner .sub {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  @keyframes banner-in {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .empty-state {
    margin-top: 20px;
    padding: 30px 18px;
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    background: var(--surface);
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.75;
    letter-spacing: 0.04em;
  }

  ol.tasks { list-style: none; margin: 10px 0 0; padding: 0; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .task:last-child { border-bottom: none; }

  .task-check {
    flex: none;
    width: 21px;
    height: 21px;
    margin-top: 2px;
    border-radius: 2px;
    border: 1px solid #343A43;
    background: var(--plate);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: inset 0 1px 0 var(--bevel);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .task-check:hover { border-color: #4C535D; }
  .task-check:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

  .task-check svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(0.55);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .task-check svg path { stroke: #08090A; }

  .task.done .task-check {
    background: var(--brass);
    border-color: #C79E63;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .task.done .task-check svg { opacity: 1; transform: scale(1); }

  .task-body { flex: 1; padding-top: 1px; min-width: 0; }

  .task-title {
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  .task.done .task-title {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: rgba(176, 141, 87, 0.5);
    text-decoration-thickness: 1px;
  }

  .task-meta {
    margin-top: 3px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .task-meta .sep { color: var(--ink-faint); margin: 0 6px; }
  .task-meta .cat {
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 9.5px;
  }
  .task.done .task-meta { opacity: 0.55; }

  .foot {
    padding: 20px 0 6px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px solid var(--line-soft);
    margin-top: 22px;
  }

  /* ---------- calendar link row ---------- */

  .sync-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 22px 12px;
  }

  .sync-note {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }

  .sync-note::before {
    content: "";
    flex: none;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink-faint);
  }

  .sync-note.live::before { background: var(--brass); box-shadow: 0 0 7px rgba(176, 141, 87, 0.85); }
  .sync-note.warn { color: #C98A5A; }
  .sync-note.warn::before { background: #C98A5A; }
  .sync-note.busy::before { background: var(--steel); animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .cal-btn {
    flex: none;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
    background: var(--plate);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--bevel);
  }
  .cal-btn:hover { color: #fff; border-color: #2B3039; }
  .cal-btn:focus-visible { outline: 1px solid var(--steel); outline-offset: 2px; }

(function () {
  "use strict";

  var TASKS_BY_DATE = JSON.parse(document.getElementById("tasks-data").textContent);
  var STORE_KEY = "day-manifest-done-state";
  var DONE_STATE = {};
  try {
    DONE_STATE = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  } catch (e) {
    DONE_STATE = {};
  }

  function shiftDays(date, n) {
    var d = new Date(date.getTime());
    d.setDate(d.getDate() + n);
    return d;
  }
  function keyOf(date) {
    return date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0") + "-" +
      String(date.getDate()).padStart(2, "0");
  }
  // Rolling window, recomputed on every load — the app never ages out.
  var START = keyOf(shiftDays(new Date(), -3));
  var END = keyOf(shiftDays(new Date(), 30));
  var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
  var checkSvg =
    '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---- goofy sound effects (Web Audio, no files needed) ----
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        return null;
      }
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    return audioCtx;
  }
  function blip(freqFrom, freqTo, dur, type, startAt, vol) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "square";
    var t = ctx.currentTime + (startAt || 0);
    osc.frequency.setValueAtTime(freqFrom, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqTo, 1), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(vol || 0.16, t + Math.min(0.02, dur * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  function noiseBurst(dur, startAt, filterFrom, filterTo, vol) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var t = ctx.currentTime + (startAt || 0);
    var size = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < size; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(filterFrom || 4000, t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(filterTo || 200, 20), t + dur);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(vol || 0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
  }
  function gunshot() {
    blip(1800, 200, 0.05, "square", 0, 0.2);
    noiseBurst(0.18, 0.005, 5000, 150, 0.32);
  }
  function playBoop(checked) {
    if (checked) {
      // cartoon "pow!" gunshot
      gunshot();
    } else {
      blip(500, 160, 0.12, "sawtooth", 0, 0.12);
    }
  }
  function playFanfare() {
    // big explosive boom + sub thump
    noiseBurst(0.5, 0, 3000, 80, 0.4);
    blip(90, 40, 0.4, "sine", 0, 0.3);
    // firework crackle
    for (var k = 0; k < 4; k++) {
      noiseBurst(0.12, 0.15 + k * 0.09, 6000, 1000, 0.15);
    }
    // triumphant arpeggio riding on top
    var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    for (var i = 0; i < notes.length; i++) {
      blip(notes[i] * 0.9, notes[i], 0.16, "square", 0.15 + i * 0.08, 0.15);
    }
    blip(1200, 2200, 0.35, "triangle", 0.15 + notes.length * 0.08, 0.08);
  }

  function toDate(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function toKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function dateRange(startKey, endKey) {
    var out = [];
    var cur = toDate(startKey);
    var end = toDate(endKey);
    while (cur <= end) {
      out.push(toKey(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }

  var todayKey = toKey(new Date());
  var dates = dateRange(START, END);
  var selectedKey = dates.indexOf(todayKey) !== -1 ? todayKey : dates[0];

  (function () {
    var s = toDate(START), e = toDate(END);
    document.getElementById("rangeLine").textContent =
      (s.getMonth() + 1) + "." + String(s.getDate()).padStart(2, "0") + " — " +
      (e.getMonth() + 1) + "." + String(e.getDate()).padStart(2, "0");
  })();

  var statusEl = document.getElementById("sync-note");
  function setStatus(text, kind) {
    if (!statusEl) return;
    statusEl.textContent = text || "";
    statusEl.className = "sync-note" + (kind ? " " + kind : "");
  }
  setStatus("記錄留喺呢部機");

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(DONE_STATE));
    } catch (e) {
      // storage unavailable (private mode, quota) — state stays in memory only
    }
  }

  function isDayComplete(dateKey, state) {
    var tasks = TASKS_BY_DATE[dateKey] || [];
    if (!tasks.length) return false;
    for (var i = 0; i < tasks.length; i++) {
      if (!state[tasks[i].id]) return false;
    }
    return true;
  }

  function toggleTask(taskId, dateKey) {
    var wasComplete = isDayComplete(dateKey, DONE_STATE);
    DONE_STATE[taskId] = !DONE_STATE[taskId];
    playBoop(!!DONE_STATE[taskId]);
    renderPanel();
    renderRail();
    if (!wasComplete && isDayComplete(dateKey, DONE_STATE)) celebrate();
    persist();
  }

  function dayStatus(key) {
    var tasks = TASKS_BY_DATE[key] || [];
    if (!tasks.length) return "empty";
    var done = 0;
    for (var i = 0; i < tasks.length; i++) if (DONE_STATE[tasks[i].id]) done++;
    if (done === tasks.length) return "all-done";
    return "open";
  }

  var railEl = document.getElementById("rail");
  var panelEl = document.getElementById("panel");

  function renderRail() {
    railEl.innerHTML = "";
    dates.forEach(function (key) {
      var d = toDate(key);
      var status = dayStatus(key);
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className =
        "chip" +
        (key === selectedKey ? " selected" : "") +
        (status === "open" ? " has-open" : "") +
        (status === "all-done" ? " has-all-done" : "");
      chip.id = "chip-" + key;
      chip.setAttribute("aria-label", (d.getMonth() + 1) + "月" + d.getDate() + "日");
      chip.innerHTML =
        '<span class="wd">' + WEEKDAYS[d.getDay()] + "</span>" +
        '<span class="num">' + d.getDate() + "</span>" +
        '<span class="dot"></span>';
      chip.addEventListener("click", function () {
        selectDay(key, true);
      });
      railEl.appendChild(chip);
    });
  }

  function renderPanel() {
    var key = selectedKey;
    var d = toDate(key);
    var isToday = key === todayKey;
    var tasks = TASKS_BY_DATE[key] || [];
    var doneCount = 0;
    for (var i = 0; i < tasks.length; i++) if (DONE_STATE[tasks[i].id]) doneCount++;

    var isComplete = tasks.length > 0 && doneCount === tasks.length;

    var ringHtml = "";
    if (tasks.length) {
      var r = 19, c = 2 * Math.PI * r;
      var frac = doneCount / tasks.length;
      var offset = c * (1 - frac);
      var label = isComplete
        ? '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : doneCount + "/" + tasks.length;
      ringHtml =
        '<div class="ring-wrap' + (isComplete ? " complete" : "") + '"><svg viewBox="0 0 46 46">' +
        '<circle class="ring-track" cx="23" cy="23" r="' + r + '" fill="none" stroke-width="3"/>' +
        '<circle class="ring-fill" cx="23" cy="23" r="' + r + '" fill="none" stroke-width="3" ' +
        'stroke-linecap="butt" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/>' +
        '</svg><span class="ring-label">' + label + "</span></div>";
    }

    var bannerHtml = "";
    if (isComplete) {
      bannerHtml =
        '<div class="celebrate-banner">' +
        '<span class="icon"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<div><div class="text">今日行程全部完成</div>' +
        '<div class="sub">' + tasks.length + " / " + tasks.length + " CLEARED</div></div>" +
        "</div>";
    }

    var bodyHtml;
    if (!tasks.length) {
      bodyHtml = '<div class="empty-state">呢日冇安排行程<br>安心休息</div>';
    } else {
      bodyHtml =
        '<ol class="tasks">' +
        tasks
          .map(function (task) {
            var isDone = !!DONE_STATE[task.id];
            return (
              '<li class="task' + (isDone ? " done" : "") + '" data-id="' + task.id + '">' +
              '<button class="task-check" type="button" aria-label="標記完成:' + task.title + '">' + checkSvg + "</button>" +
              '<div class="task-body"><div class="task-title">' + task.title + "</div>" +
              '<div class="task-meta">' + task.time + '<span class="sep">·</span><span class="cat">' + task.tag + "</span></div>" +
              "</div></li>"
            );
          })
          .join("") +
        "</ol>";
    }

    panelEl.innerHTML =
      '<div class="day-head">' +
      '<span class="day-date">' + (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0") + "</span>" +
      '<div class="day-meta"><span class="day-wd">星期' + WEEKDAYS[d.getDay()] + "</span>" +
      (isToday ? '<div class="day-badge">Today</div>' : "") +
      "</div>" + ringHtml +
      "</div>" + bannerHtml + bodyHtml +
      '<div class="foot">' + dates.length + " days · " + Object.keys(TASKS_BY_DATE).reduce(function (n, k) { return n + TASKS_BY_DATE[k].length; }, 0) + " events</div>";

    panelEl.querySelectorAll(".task-check").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest(".task");
        toggleTask(li.dataset.id, key);
      });
    });
  }

  function celebrate() {
    playFanfare();
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;

    var canvas = document.getElementById("confettiCanvas");
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    var colors = ["#B08D57", "#C9D1DA", "#8A9099", "#E6EBF0"];
    var originX = w / 2;
    var originY = h * 0.32;
    var particles = Array.from({ length: 46 }, function () {
      var angle = Math.random() * Math.PI * 2;
      var speed = 2.5 + Math.random() * 4.5;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 2 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1
      };
    });

    var start = performance.now();
    var duration = 1400;

    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, w, h);
      particles.forEach(function (p) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.rot += p.vr;
        p.life = Math.max(0, 1 - t / duration);
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
        ctx.restore();
      });
      if (t < duration) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
      }
    }
    requestAnimationFrame(frame);
  }

  function selectDay(key, scrollChip) {
    selectedKey = key;
    renderRail();
    renderPanel();
    if (scrollChip) {
      var chip = document.getElementById("chip-" + key);
      if (chip) chip.scrollIntoView({ inline: "center", block: "nearest" });
    }
  }

  document.getElementById("todayBtn").addEventListener("click", function () {
    if (dates.indexOf(todayKey) !== -1) selectDay(todayKey, true);
  });

  renderRail();
  renderPanel();
  var initialChip = document.getElementById("chip-" + selectedKey);
  if (initialChip) initialChip.scrollIntoView({ inline: "center", block: "nearest" });


  // ================= Google Calendar (direct OAuth, no server) =================
  // Paste the OAuth Client ID from Google Cloud Console here.
  var CLIENT_ID = "98194966680-i18bidhludaiiro7ilh5grli9i82o443.apps.googleusercontent.com";
  var CAL_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
  var LINK_KEY = "day-manifest-cal-linked";
  var CACHE_KEY = "day-manifest-cal-cache";
  var TOKEN_KEY = "day-manifest-cal-token";
  var cachedAt = 0;

  var calBtn = document.getElementById("calBtn");
  var tokenClient = null;
  var accessToken = null;
  var refreshTimer = null;

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  function showConnect(label) {
    if (!calBtn) return;
    calBtn.textContent = label || "連接日曆";
    calBtn.hidden = false;
  }
  function hideConnect() { if (calBtn) calBtn.hidden = true; }

  // When a token lapses we still have yesterday's rows on screen; say so
  // calmly and offer a refresh instead of shouting that something broke.
  function softFallback() {
    if (cachedAt) {
      showConnect("更新");
      setStatus("資料截至 " + hhmm(new Date(cachedAt)) + " · 撳「更新」攞最新");
    } else {
      showConnect("連接日曆");
      setStatus("撳「連接日曆」接上 Google Calendar");
    }
  }

  // Paint whatever was fetched last time, so a cold start is not empty.
  (function primeFromCache() {
    var raw = lsGet(CACHE_KEY);
    if (!raw) return;
    try {
      var cached = JSON.parse(raw);
      if (cached && cached.byDate && Object.keys(cached.byDate).length) {
        TASKS_BY_DATE = cached.byDate;
        cachedAt = cached.at || 0;
        renderRail();
        renderPanel();
        setStatus(cachedAt ? "資料截至 " + hhmm(new Date(cachedAt)) : "顯示緊上次同步嘅資料");
      }
    } catch (e) {}
  })();

  function hhmm(d) {
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function tagFor(name) {
    var OVERRIDE = { "Private Stuff": "PRIVATE", "香港節慶假日": "HOLIDAY" };
    return String(OVERRIDE[name] || name || "").toUpperCase();
  }

  function timeLabel(ev) {
    var st = ev.start || {};
    var en = ev.end || {};
    if (st.date && !st.dateTime) return "全日";
    if (!st.dateTime) return "";
    return String(st.dateTime).slice(11, 16) +
      (en.dateTime ? "–" + String(en.dateTime).slice(11, 16) : "");
  }

  function gfetch(url) {
    return fetch(url, { headers: { Authorization: "Bearer " + accessToken } })
      .then(function (res) {
        if (res.ok) return res.json();
        // Read Google's error body so the UI can name the real cause.
        return res.text().then(function (body) {
          var reason = "", message = "";
          try {
            var parsed = JSON.parse(body);
            var e = parsed && parsed.error;
            if (e) {
              message = e.message || "";
              if (e.errors && e.errors[0]) reason = e.errors[0].reason || "";
              if (!reason && e.status) reason = e.status;
            }
          } catch (parseErr) {}
          if (res.status === 401) accessToken = null;
          var err = new Error(message || ("http " + res.status));
          err.code = res.status;
          err.reason = reason;
          err.detail = message;
          throw err;
        });
      });
  }

  function loadCalendars() {
    setStatus("讀緊 Google Calendar…", "busy");
    var listUrl = "https://www.googleapis.com/calendar/v3/users/me/calendarList" +
      "?minAccessRole=reader&maxResults=250";
    return gfetch(listUrl).then(function (data) {
      var cals = (data && data.items) || [];
      if (!cals.length) {
        setStatus("Google 帳戶入面搵唔到日曆", "warn");
        return;
      }
      var timeMin = new Date(START + "T00:00:00+08:00").toISOString();
      var timeMax = new Date(END + "T23:59:59+08:00").toISOString();
      return Promise.all(cals.map(function (cal) {
        var url = "https://www.googleapis.com/calendar/v3/calendars/" +
          encodeURIComponent(cal.id) + "/events" +
          "?singleEvents=true&orderBy=startTime&maxResults=250" +
          "&timeZone=Asia/Hong_Kong" +
          "&timeMin=" + encodeURIComponent(timeMin) +
          "&timeMax=" + encodeURIComponent(timeMax);
        return gfetch(url)
          .then(function (res) { return { name: cal.summary, events: (res && res.items) || [] }; })
          .catch(function () { return { name: cal.summary, events: [], failed: true }; });
      })).then(merge);
    });
  }

  function merge(results) {
    var byDate = {};
    var failed = 0;
    results.forEach(function (r) {
      if (r.failed) { failed++; return; }
      r.events.forEach(function (ev) {
        if (!ev || ev.status === "cancelled") return;
        var st = ev.start || {};
        var at = st.dateTime || st.date;
        if (!at) return;
        var key = String(at).slice(0, 10);
        (byDate[key] = byDate[key] || []).push({
          id: ev.id,
          title: ev.summary || "(未命名)",
          time: timeLabel(ev),
          tag: tagFor(r.name),
          at: at
        });
      });
    });
    Object.keys(byDate).forEach(function (k) {
      byDate[k].sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
    });

    TASKS_BY_DATE = byDate;
    lsSet(CACHE_KEY, JSON.stringify({ byDate: byDate, at: Date.now() }));
    lsSet(LINK_KEY, "1");
    renderRail();
    renderPanel();
    hideConnect();

    var when = hhmm(new Date());
    if (failed) setStatus("已同步 " + when + " · " + failed + " 個日曆讀唔到", "warn");
    else setStatus("已連接 Google Calendar · 更新於 " + when, "live");

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function () {
      if (document.visibilityState === "visible" && accessToken) {
        loadCalendars().catch(handleAuthLoss);
      }
    }, 300000);
  }

  function handleAuthLoss(err) {
    var code = err && err.code;
    var reason = (err && err.reason) || "";
    var detail = (err && err.detail) || "";

    if (code === 401) {          // token expired — drop it, try a quiet refresh
      accessToken = null;
      lsSet(TOKEN_KEY, "");
      requestToken(true);
      return;
    }

    if (reason === "accessNotConfigured" || detail.indexOf("has not been used in project") !== -1) {
      showConnect("再試");
      setStatus("Google Calendar API 未啟用 · 去 Cloud Console 啟用佢", "warn");
      return;
    }

    if (reason === "insufficientPermissions" || reason === "forbidden" || code === 403) {
      showConnect("重新授權");
      setStatus("權限不足 · 重新授權時要剔埋日曆權限（" + (reason || code) + "）", "warn");
      return;
    }

    if (!code && cachedAt) {     // offline / flaky network — keep it calm
      softFallback();
      return;
    }
    showConnect("再試");
    setStatus("讀日曆出錯 " + (code || "") + " " + (reason || detail || ""), "warn");
  }

  function requestToken(silent) {
    if (!tokenClient) return;
    try {
      tokenClient.requestAccessToken({ prompt: silent ? "" : "consent" });
    } catch (e) {
      showConnect();
      setStatus("撳「連接日曆」授權 Google Calendar", "warn");
    }
  }

  function initGis() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) return false;
    if (CLIENT_ID.indexOf("__GOOGLE") === 0) {
      setStatus("未設定 Google Client ID · 日曆未連接", "warn");
      return true;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: CAL_SCOPE,
      callback: function (resp) {
        if (resp && resp.access_token) {
          accessToken = resp.access_token;
          var ttl = (parseInt(resp.expires_in, 10) || 3600) * 1000;
          lsSet(TOKEN_KEY, JSON.stringify({ t: accessToken, exp: Date.now() + ttl - 60000 }));
          hideConnect();
          loadCalendars().catch(handleAuthLoss);
        } else {
          softFallback();
        }
      },
      error_callback: function () {
        softFallback();
      }
    });

    if (calBtn) {
      calBtn.addEventListener("click", function () { requestToken(false); });
    }

    // A token from an earlier launch is good for about an hour — reuse it
    // so reopening the app does not ask for anything.
    var saved = null;
    try { saved = JSON.parse(lsGet(TOKEN_KEY) || "null"); } catch (e) { saved = null; }
    if (saved && saved.t && saved.exp > Date.now()) {
      accessToken = saved.t;
      hideConnect();
      loadCalendars().catch(handleAuthLoss);
      return true;
    }

    if (lsGet(LINK_KEY) === "1") {
      requestToken(true);          // already granted once — try silently
    } else {
      showConnect();
      setStatus("撳「連接日曆」接上 Google Calendar");
    }
    return true;
  }

  (function waitForGis() {
    if (initGis()) return;
    var tries = 0;
    var t = setInterval(function () {
      tries++;
      if (initGis() || tries > 40) clearInterval(t);
    }, 250);
  })();

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && accessToken) {
      loadCalendars().catch(handleAuthLoss);
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script></body></html>
